services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
      traefik:
    env_file:
      - .env
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
      - "7000:7000/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wg-easy.rule=Host(`vpn.eduindev.com`)'
      - 'traefik.http.routers.wg-easy.entrypoints=websecure'
      - 'traefik.http.routers.wg-easy.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.wg-easy.priority=100'
      - 'traefik.http.routers.wg-easy.service=wg-easy'
      - 'traefik.http.services.wg-easy.loadbalancer.server.port=51821'
      - 'traefik.http.routers.k8s.rule=HostRegexp(`^.+\.eduindev\.com$$`)'
      - 'traefik.http.routers.k8s.entrypoints=websecure'
      - 'traefik.http.routers.k8s.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.k8s.tls.domains[0].main=*.eduindev.com'
      - 'traefik.http.routers.k8s.tls.domains[0].sans=eduindev.com'
      - 'traefik.http.routers.k8s.priority=10'
      - 'traefik.http.routers.k8s.service=k8s'
      - 'traefik.http.services.k8s.loadbalancer.server.port=8000'
      - 'traefik.http.routers.takuteku-mail.rule=Host(`mail.takuteku.com`) || Host(`webmail.takuteku.com`) || Host(`autoconfig.takuteku.com`) || Host(`autodiscover.takuteku.com`) || Host(`mta-sts.takuteku.com`)'
      - 'traefik.http.routers.takuteku-mail.entrypoints=websecure'
      - 'traefik.http.routers.takuteku-mail.tls.certresolver=letsencrypt-http'
      - 'traefik.http.routers.takuteku-mail.priority=20'
      - 'traefik.http.routers.takuteku-mail.service=k8s'
      - 'traefik.http.routers.takuteku-mail-http.rule=Host(`mail.takuteku.com`) || Host(`webmail.takuteku.com`) || Host(`autoconfig.takuteku.com`) || Host(`autodiscover.takuteku.com`) || Host(`mta-sts.takuteku.com`)'
      - 'traefik.http.routers.takuteku-mail-http.entrypoints=web'
      - 'traefik.http.routers.takuteku-mail-http.middlewares=takuteku-mail-https'
      - 'traefik.http.routers.takuteku-mail-http.service=k8s'
      - 'traefik.http.middlewares.takuteku-mail-https.redirectscheme.scheme=https'
      - 'traefik.tcp.routers.mail-smtp.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.mail-smtp.entrypoints=smtp'
      - 'traefik.tcp.routers.mail-smtp.service=mail-smtp'
      - 'traefik.tcp.services.mail-smtp.loadbalancer.server.port=2525'
      - 'traefik.tcp.services.mail-smtp.loadbalancer.proxyprotocol.version=2'
      - 'traefik.tcp.routers.mail-submissions.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.mail-submissions.entrypoints=submissions'
      - 'traefik.tcp.routers.mail-submissions.service=mail-submissions'
      - 'traefik.tcp.services.mail-submissions.loadbalancer.server.port=4465'
      - 'traefik.tcp.services.mail-submissions.loadbalancer.proxyprotocol.version=2'
      - 'traefik.tcp.routers.mail-submission.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.mail-submission.entrypoints=submission'
      - 'traefik.tcp.routers.mail-submission.service=mail-submission'
      - 'traefik.tcp.services.mail-submission.loadbalancer.server.port=5587'
      - 'traefik.tcp.services.mail-submission.loadbalancer.proxyprotocol.version=2'
      - 'traefik.tcp.routers.mail-imaps.rule=HostSNI(`*`)'
      - 'traefik.tcp.routers.mail-imaps.entrypoints=imaps'
      - 'traefik.tcp.routers.mail-imaps.service=mail-imaps'
      - 'traefik.tcp.services.mail-imaps.loadbalancer.server.port=9993'
      - 'traefik.tcp.services.mail-imaps.loadbalancer.proxyprotocol.version=2'
      - 'traefik.docker.network=traefik'

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
  traefik:
    name: traefik
    external: true

