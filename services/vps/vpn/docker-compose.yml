services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
      traefik:
    env_file:
      - .env
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
      - "7000:7000/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.wg-easy.rule=Host(`vpn.eduindev.com`)'
      - 'traefik.http.routers.wg-easy.entrypoints=websecure'
      - 'traefik.http.routers.wg-easy.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.wg-easy.priority=100'
      - 'traefik.http.routers.wg-easy.service=wg-easy'
      - 'traefik.http.services.wg-easy.loadbalancer.server.port=51821'
      - 'traefik.http.routers.k8s.rule=HostRegexp(`^.+\.eduindev\.com$$`)'
      - 'traefik.http.routers.k8s.entrypoints=websecure'
      - 'traefik.http.routers.k8s.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.k8s.tls.domains[0].main=*.eduindev.com'
      - 'traefik.http.routers.k8s.tls.domains[0].sans=eduindev.com'
      - 'traefik.http.routers.k8s.priority=10'
      - 'traefik.http.routers.k8s.service=k8s'
      - 'traefik.http.services.k8s.loadbalancer.server.port=8000'
      - 'traefik.docker.network=traefik'

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
  traefik:
    name: traefik
    external: true

